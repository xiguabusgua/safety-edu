# .github/workflows/deploy.yml
# 推送 main 分支 → 自动构建 → scp → pm2 reload → 健康检查
#
# 首次使用设置:
#   1. GitHub 仓库 → Settings → Secrets → Actions → 添加:
#      - DEPLOY_HOST:  服务器 IP (如 154.9.25.199)
#      - DEPLOY_USER:  SSH 用户名 (如 root)
#      - DEPLOY_KEY:   SSH 私钥 (cat ~/.ssh/id_rsa 的全部内容)
#      - DEPLOY_PORT:  SSH 端口 (默认 22, 可不加)
#   2. 服务器提前跑一次"一次性准备"命令
#      (见 README.md 或下面的注释块)

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check + Build
        run: |
          cd apps/api
          DATABASE_URL='mysql://fake:fake@localhost:3306/fake' \
          JWT_SECRET='ci-typecheck-secret-32chars!' \
          COOKIE_SECRET='ci-typecheck-cookie-32chars!' \
          ACCOUNT_ENC_KEY=$(printf 'a%.0s' {1..64}) \
          npx tsc --noEmit
          cd ../web && npx tsc --noEmit
          cd ../.. && pnpm build:all

      - name: Package
        run: |
          tar czf deploy.tgz \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='*.log' \
            --exclude='.reasonix' \
            apps/api/dist \
            apps/web/dist \
            apps/api/package.json \
            apps/api/prisma \
            apps/worker \
            packages \
            ecosystem.config.cjs \
            pnpm-workspace.yaml \
            package.json \
            pnpm-lock.yaml \
            scripts/deploy.sh

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: deploy.tgz
          target: /tmp/

      - name: Deploy & Restart
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            APP_DIR=/www/wwwroot/safety-edu
            TS=$(date +%s)

            # 解压到 releases/<ts>/
            mkdir -p "$APP_DIR/releases/$TS"
            tar xzf /tmp/deploy.tgz -C "$APP_DIR/releases/$TS"

            cd "$APP_DIR/releases/$TS"

            # 安装生产依赖
            pnpm install --frozen-lockfile --prod 2>/dev/null || true

            # 数据库迁移
            cd apps/api
            npx prisma generate 2>/dev/null || true
            npx prisma migrate deploy 2>/dev/null || echo "[warn] prisma migrate deploy 跳过(首次需手动执行)"

            cd "$APP_DIR"

            # 共享 .env + logs
            [ -f shared/.env ] && cp shared/.env "releases/$TS/.env"
            rm -rf "releases/$TS/logs"
            ln -snf "$APP_DIR/shared/logs" "releases/$TS/logs"

            # 切换 current → 新版本
            ln -snf "releases/$TS" current

            # 启动/重启
            pm2 startOrReload ecosystem.config.cjs --env production 2>&1 | tail -10

            # 健康检查 (最多等 15s)
            for i in $(seq 1 15); do
              if curl -sf --max-time 2 http://127.0.0.1:3002/api/health > /dev/null 2>&1; then
                echo "✅ 健康检查通过"
                break
              fi
              [ $i -eq 15 ] && { echo "❌ 健康检查失败"; pm2 logs safety-api --lines 10 --nostream; exit 1; }
              sleep 1
            done

            # 清理旧版本 (保留最近 5 个)
            cd releases && ls -1t | tail -n +6 | xargs -r rm -rf
            rm -f /tmp/deploy.tgz
            echo "✅ 部署完成"
