# =============================================================================
# safety-edu · GitHub Actions 自动部署(Docker 模式)
#
# 触发:  push main / 手动 workflow_dispatch
# 流程:  type-check → scp 推代码 → rsync 同步 → docker compose build/up → 健康检查
# 路径:  服务器 /opt/safety-edu(项目) + /opt/safety-edu-staging(暂存)
#
# 首次使用(一次性):
#   1. 仓库 Settings → Secrets and variables → Actions → New repository secret:
#      - DEPLOY_HOST:  154.9.25.199
#      - DEPLOY_USER:  deploy  (或 root,看 scripts/setup-server.sh 怎么配)
#      - DEPLOY_KEY:   私钥全文 (cat ~/.ssh/safety_edu_deploy | head -1 不行,要从 -----BEGIN 开始到 -----END)
#   2. 服务器跑一次 scripts/setup-server.sh(见该脚本顶部说明)
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许 Actions 页面手动触发,排查用

concurrency:
  group: production-deploy
  cancel-in-progress: false  # 不要打断进行中的部署,排队等

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # ---- 1. 类型检查(防止发错代码) ----
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check (api + web)
        run: |
          cd apps/api
          DATABASE_URL='mysql://fake:fake@localhost:3306/fake' \
          JWT_SECRET='ci-typecheck-secret-32chars!' \
          COOKIE_SECRET='ci-typecheck-cookie-32chars!' \
          ACCOUNT_ENC_KEY=$(printf 'a%.0s' {1..64}) \
            npx tsc --noEmit
          cd ../web && npx tsc --noEmit

      # ---- 2. 同步代码到服务器(走 staging 暂存) ----
      #    用 rsync 模式,scp-action 自动调用 rsync
      #    exclude: .env (服务端永不被覆盖) / .git / node_modules / docker volumes
      - name: Sync code → /opt/safety-edu-staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          source: "./"
          target: "/opt/safety-edu-staging/"
          rsync: true
          args: >-
            -avz
            --exclude=.env
            --exclude=mysql-data
            --exclude=.git
            --exclude=node_modules
            --exclude=.reasonix
            --exclude=.codegraph
            --exclude=deploy.tgz

      # ---- 3. 在服务器上:rsync staging → prod,build,up,verify ----
      - name: Deploy · rsync → build → up → health check
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script: |
            set -e

            PROD=/opt/safety-edu
            STAGING=/opt/safety-edu-staging

            # ---- 同步 staging → prod(保留 prod 自己的 .env) ----
            cd "$PROD"
            rsync -a --delete \
              --exclude='.env' \
              --exclude='mysql-data' \
              --exclude='node_modules' \
              "$STAGING/" "$PROD/"

            # ---- 构建 + 启动 ----
            echo "🐳 docker compose build..."
            docker compose build 2>&1 | tail -30

            echo "🚀 docker compose up -d..."
            docker compose up -d

            # ---- 等 MySQL(健康检查通过) ----
            echo "⏳ Waiting for MySQL..."
            for i in $(seq 1 60); do
              if docker inspect --format='{{.State.Health.Status}}' safety-mysql 2>/dev/null | grep -q healthy; then
                echo "✅ MySQL ready"
                break
              fi
              [ "$i" -eq 60 ] && { echo "❌ MySQL 健康检查超时"; docker compose logs --tail=30 mysql; exit 1; }
              sleep 2
            done

            # ---- 等 API(自动跑 prisma migrate deploy) ----
            echo "⏳ Waiting for API (runs prisma migrate deploy)..."
            for i in $(seq 1 60); do
              if curl -sf --max-time 3 http://localhost:3002/api/health > /dev/null 2>&1; then
                echo "✅ API healthy"
                docker compose ps
                echo ""
                echo "🎉 部署成功"
                exit 0
              fi
              [ "$i" -eq 60 ] && {
                echo "❌ API 健康检查失败,查看日志:"
                docker compose logs --tail=80 api
                exit 1
              }
              sleep 2
            done
