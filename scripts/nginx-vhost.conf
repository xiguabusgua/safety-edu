# ====== Nginx vhost 示例 ======
# 文件路径：/www/server/panel/vhost/nginx/safety.52akuya.asia.conf
# 加载后：nginx -t && nginx -s reload
#
# Express 现在同时 serve 前端静态文件 + API,nginx 只需反代到同一个端口(默认 3002)

server {
    listen 80;
    listen [::]:80;
    server_name safety.52akuya.asia;

    # 强制 HTTPS（SSL 证书用宝塔申请）
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name safety.52akuya.asia;

    # SSL（宝塔申请后自动填）
    ssl_certificate     /www/server/panel/vhost/cert/safety.52akuya.asia/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/safety.52akuya.asia/privkey.pem;

    # 上传大小
    client_max_body_size 4m;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 全部流量反代到 Express (静态文件 + API + SPA fallback 都在一个端口)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接支持
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
    }

    # 健康检查（nginx 自身, 绕过 Express）
    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
